openapi: 3.1.0

info:
  title: Runcoil dashboard API
  version: 1.0.0
  description: The API of the Runcoil dashboard.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /api/v1

security:
  - sessionCookie: []

tags:
  - name: Auth
  - name: Projects
  - name: Users
  - name: Members
  - name: API keys
  - name: Runs
  - name: Tasks
  - name: Workers
  - name: System

paths:
  /auth/login:
    $ref: "./paths/auth.yaml#/login"
  /auth/logout:
    $ref: "./paths/auth.yaml#/logout"
  /me:
    $ref: "./paths/me.yaml#/me"
  /me/password:
    $ref: "./paths/me.yaml#/mePassword"
  /projects:
    $ref: "./paths/projects.yaml#/projects"
  /projects/{projectId}/members:
    $ref: "./paths/members.yaml#/members"
  /projects/{projectId}/members/{userId}:
    $ref: "./paths/members.yaml#/member"
  /projects/{projectId}/api-keys:
    $ref: "./paths/api_keys.yaml#/apiKeys"
  /projects/{projectId}/api-keys/{apiKeyId}/revoke:
    $ref: "./paths/api_keys.yaml#/apiKeyRevoke"
  /projects/{projectId}/runs:
    $ref: "./paths/runs.yaml#/runs"
  /projects/{projectId}/runs/{runId}:
    $ref: "./paths/runs.yaml#/run"
  /projects/{projectId}/tasks:
    $ref: "./paths/tasks.yaml#/tasks"
  /projects/{projectId}/tasks/{taskId}:
    $ref: "./paths/tasks.yaml#/task"
  /projects/{projectId}/workers:
    $ref: "./paths/workers.yaml#/workers"
  /users:
    $ref: "./paths/users.yaml#/users"
  /users/lookup:
    $ref: "./paths/users.yaml#/usersLookup"
  /users/{userId}:
    $ref: "./paths/users.yaml#/user"
  /users/{userId}/password:
    $ref: "./paths/users.yaml#/userPassword"
  /version:
    $ref: "./paths/version.yaml#/version"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: runcoil_session
      description: The session cookie that login sets.
