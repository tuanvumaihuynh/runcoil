version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /docker/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A newer Go minor is a deliberate upgrade: go.mod and the Dockerfiles move together.
      - dependency-name: golang
        update-types: ["version-update:semver-minor"]
