<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Runcoil</title>
    <script>
      // Applies the stored or system theme before first paint. Keep the key in step with src/lib/theme.ts.
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem("runcoil-theme");
        } catch (error) {
          // Storage is blocked: fall through to the system theme.
        }
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
