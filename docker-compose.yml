services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 2s
      timeout: 5s
      retries: 15

  runcoil-migrate:
    build:
      context: .
      dockerfile: docker/runcoil/runcoil-migrate.dockerfile
    restart: "no"
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: text
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  runcoil:
    build:
      context: .
      dockerfile: docker/runcoil/runcoil.dockerfile
    restart: unless-stopped
    environment:
      AUTO_MIGRATE: false
      LOG_LEVEL: info
      LOG_FORMAT: text
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_SSL_MODE: disable
      POSTGRES_MAX_CONNS: 10
      API_PORT: 8080
      DISPATCHER_PORT: 7070
    ports:
      - 8080:8080
      - 7070:7070
    depends_on:
      runcoil-migrate:
        condition: service_completed_successfully

volumes:
  pg-data:
