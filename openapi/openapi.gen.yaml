openapi: 3.1.0
info:
  title: Runcoil dashboard API
  version: 1.0.0
  description: The API of the Runcoil dashboard.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Projects
  - name: Users
  - name: Members
  - name: API keys
  - name: Runs
  - name: Workers
  - name: System
paths:
  /users:
    $ref: "#/components/pathItems/users"
  /projects/{projectId}/runs:
    $ref: "#/components/pathItems/runs"
  /me:
    $ref: "#/components/pathItems/me"
  /version:
    $ref: "#/components/pathItems/version"
  /projects:
    $ref: "#/components/pathItems/projects"
  /projects/{projectId}/members:
    $ref: "#/components/pathItems/members"
  /auth/login:
    $ref: "#/components/pathItems/login"
  /projects/{projectId}/api-keys:
    $ref: "#/components/pathItems/apiKeys"
  /projects/{projectId}/workers:
    $ref: "#/components/pathItems/workers"
  /me/password:
    $ref: "#/components/pathItems/mePassword"
  /auth/logout:
    $ref: "#/components/pathItems/logout"
  /projects/{projectId}/api-keys/{apiKeyId}/revoke:
    $ref: "#/components/pathItems/apiKeyRevoke"
  /projects/{projectId}/members/{userId}:
    $ref: "#/components/pathItems/member"
  /projects/{projectId}/runs/{runId}:
    $ref: "#/components/pathItems/run"
  /users/lookup:
    $ref: "#/components/pathItems/usersLookup"
  /users/{userId}:
    $ref: "#/components/pathItems/user"
  /users/{userId}/password:
    $ref: "#/components/pathItems/userPassword"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: runcoil_session
      description: The session cookie that login sets.
  schemas:
    LoginRequest:
      type: object
      description: A username or an email, and its password.
      additionalProperties: false
      properties:
        login:
          type: string
          description: A username or an email.
          minLength: 1
          maxLength: 254
          example: admin
          x-order: 1
        password:
          type: string
          description: The user's password.
          minLength: 1
          maxLength: 128
          example: Secret-123
          x-order: 2
      required:
        - login
        - password
    LoginResponse:
      type: object
      description: The signed-in user.
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
          description: The user who signed in.
          x-order: 1
          example:
            id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
            username: admin
        passwordChangeSuggested:
          type: boolean
          description: True when the user is the first server admin and still has the bootstrap password, so the dashboard offers to change it.
          example: false
          x-order: 2
      required:
        - user
        - passwordChangeSuggested
    User:
      type: object
      description: A dashboard user.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The user's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
          x-order: 1
        username:
          type: string
          description: The username, lowercase.
          example: admin
          x-order: 2
        email:
          type: string
          description: The email, lowercase. Absent when the user has none.
          example: admin@example.com
          x-order: 3
      required:
        - id
        - username
    Permission:
      type: string
      description: A permission, as resource:verb.
      example: runs:read
      enum:
        - runs:read
        - runs:cancel
        - tasks:read
        - schedules:read
        - schedules:write
        - workers:read
        - members:read
        - members:write
        - api_keys:read
        - api_keys:write
        - projects:read
        - projects:create
        - users:read
        - users:write
    ProjectAccess:
      type: object
      description: A project the user can open.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The project's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
          x-order: 1
        name:
          type: string
          description: The project's name.
          example: default
          x-order: 2
        role:
          $ref: "#/components/schemas/Role"
          description: The user's role in the project. A server admin is admin in every project.
          example: viewer
          x-order: 3
        permissions:
          type: array
          description: The user's permissions in the project.
          x-order: 4
          example:
            - runs:read
            - tasks:read
            - schedules:read
            - workers:read
          items:
            $ref: "#/components/schemas/Permission"
      required:
        - id
        - name
        - role
        - permissions
    Role:
      type: string
      description: A role in a project.
      example: admin
      enum:
        - admin
        - editor
        - viewer
    ErrorResponse:
      type: object
      description: The body of every error response.
      additionalProperties: false
      properties:
        code:
          type: string
          description: >-
            What went wrong, in lower snake case, such as invalid_request, unauthenticated, permission_denied, not_found, payload_too_large or internal.
          example: invalid_request
          x-order: 1
        message:
          type: string
          description: For people. Clients never parse it.
          example: current password is wrong
          x-order: 2
        params:
          type: array
          description: The request fields at fault, for invalid_request. Absent when no field is.
          x-order: 3
          example:
            - field: currentPassword
              message: current password is wrong
          items:
            $ref: "#/components/schemas/ErrorParam"
      required:
        - code
        - message
    ErrorParam:
      type: object
      description: A request field at fault.
      additionalProperties: false
      properties:
        field:
          type: string
          description: The field, as a dotted path in the body, or a parameter name.
          example: currentPassword
          x-order: 1
        message:
          type: string
          description: What is wrong with the field, for people.
          example: current password is wrong
          x-order: 2
      required:
        - field
        - message
    Me:
      type: object
      description: The signed-in user and what they can do.
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
          description: The signed-in user.
          x-order: 1
          example:
            id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f50
            username: admin
        permissions:
          type: array
          description: The server-wide permissions of the user. Only a server admin has any.
          x-order: 2
          example:
            - projects:read
            - projects:create
            - users:read
            - users:write
          items:
            $ref: "#/components/schemas/Permission"
        projects:
          type: array
          description: The projects the user can open, by name. A server admin is admin in every project.
          x-order: 3
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
              name: default
              role: viewer
              permissions:
                - runs:read
                - tasks:read
                - schedules:read
                - workers:read
          items:
            $ref: "#/components/schemas/ProjectAccess"
      required:
        - user
        - permissions
        - projects
    ChangePasswordRequest:
      type: object
      description: The current password and the new one.
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          description: The password the user has now.
          minLength: 1
          maxLength: 128
          example: admin
          x-order: 1
        newPassword:
          type: string
          description: The new password.
          minLength: 1
          maxLength: 128
          example: Secret-123
          x-order: 2
      required:
        - currentPassword
        - newPassword
    ProjectList:
      type: object
      description: Projects, by name.
      additionalProperties: false
      properties:
        projects:
          type: array
          description: The projects.
          x-order: 1
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
              name: default
              createdAt: "2026-11-14T08:00:00Z"
          items:
            $ref: "#/components/schemas/Project"
      required:
        - projects
    CreateProjectRequest:
      type: object
      description: The new project.
      additionalProperties: false
      properties:
        name:
          type: string
          description: The project's name, unique on the server and compared as written.
          minLength: 1
          maxLength: 64
          example: billing
          x-order: 1
      required:
        - name
    Project:
      type: object
      description: A project.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The project's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
          x-order: 1
        name:
          type: string
          description: The project's name.
          example: default
          x-order: 2
        createdAt:
          type: string
          format: date-time
          description: When the project was created.
          example: "2026-11-14T08:00:00Z"
          x-order: 3
      required:
        - id
        - name
        - createdAt
    MemberList:
      type: object
      description: The members of a project, by username.
      additionalProperties: false
      properties:
        members:
          type: array
          description: The members.
          x-order: 1
          example:
            - userId: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
              username: ana
              email: ana@example.com
              role: editor
          items:
            $ref: "#/components/schemas/Member"
      required:
        - members
    AddMemberRequest:
      type: object
      description: The user to add and their role.
      additionalProperties: false
      properties:
        username:
          type: string
          description: The username of the user to add.
          minLength: 1
          maxLength: 64
          example: ana
          x-order: 1
        role:
          type: string
          description: The role in the project.
          enum:
            - admin
            - editor
            - viewer
          example: editor
          x-order: 2
      required:
        - username
        - role
    Member:
      type: object
      description: A member of a project and their role.
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
          description: The member's user ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
          x-order: 1
        username:
          type: string
          description: The member's username.
          example: ana
          x-order: 2
        email:
          type: string
          description: The member's email. Absent when the user has none.
          example: ana@example.com
          x-order: 3
        role:
          $ref: "#/components/schemas/Role"
          description: The member's role in the project.
          example: editor
          x-order: 4
      required:
        - userId
        - username
        - role
    UpdateMemberRequest:
      type: object
      description: The member's new role.
      additionalProperties: false
      properties:
        role:
          type: string
          description: The new role in the project.
          enum:
            - admin
            - editor
            - viewer
          example: admin
          x-order: 1
      required:
        - role
    ApiKeyList:
      type: object
      description: The API keys of a project, revoked ones included, newest first.
      additionalProperties: false
      properties:
        apiKeys:
          type: array
          description: The API keys.
          x-order: 1
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f53
              name: production workers
              keyHint: bQlp
              createdBy: ana
              createdAt: "2026-11-16T08:00:00Z"
              lastUsedAt: "2026-11-16T09:30:00Z"
          items:
            $ref: "#/components/schemas/ApiKey"
      required:
        - apiKeys
    CreateApiKeyRequest:
      type: object
      description: The new API key.
      additionalProperties: false
      properties:
        name:
          type: string
          description: The API key's name, to tell it apart from the others.
          minLength: 1
          maxLength: 64
          example: production workers
          x-order: 1
      required:
        - name
    CreatedApiKey:
      type: object
      description: A new API key and the key itself, which is never shown again.
      additionalProperties: false
      properties:
        apiKey:
          $ref: "#/components/schemas/ApiKey"
          description: The new API key.
          example:
            id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f53
            name: production workers
            keyHint: bQlp
            createdBy: ana
            createdAt: "2026-11-16T08:00:00Z"
          x-order: 1
        key:
          type: string
          description: The key, for RUNCOIL_API_KEY. Only its hash is stored, so this response is the only time it is shown.
          example: rc_api_lUcxC1pN20eawXirnLO0Grrx1i2yG6O6oyilcOTbQlp
          x-order: 2
      required:
        - apiKey
        - key
    ApiKey:
      type: object
      description: An API key of a project. The key itself is shown only when it is made.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The API key's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f53
          x-order: 1
        name:
          type: string
          description: The API key's name.
          example: production workers
          x-order: 2
        keyHint:
          type: string
          description: The key's last 4 characters.
          example: bQlp
          x-order: 3
        createdBy:
          type: string
          description: The username of the user who made the key.
          example: ana
          x-order: 4
        createdAt:
          type: string
          format: date-time
          description: When the key was made.
          example: "2026-11-16T08:00:00Z"
          x-order: 5
        lastUsedAt:
          type: string
          format: date-time
          description: When a worker last registered with the key, to the minute. Absent when it was never used.
          example: "2026-11-16T09:30:00Z"
          x-order: 6
        revokedAt:
          type: string
          format: date-time
          description: When the key was revoked. Absent while the key works.
          example: "2026-11-16T10:00:00Z"
          x-order: 7
      required:
        - id
        - name
        - keyHint
        - createdBy
        - createdAt
    RunList:
      type: object
      description: A page of Runs, newest first.
      additionalProperties: false
      properties:
        runs:
          type: array
          description: The Runs of the page.
          x-order: 1
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f55
              status: succeeded
              task:
                id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f54
                app: shop
                name: nightly-report
              createdAt: "2026-11-16T08:00:00Z"
              startedAt: "2026-11-16T08:00:01Z"
              endedAt: "2026-11-16T08:00:09Z"
          items:
            $ref: "#/components/schemas/RunSummary"
        nextPageToken:
          type: string
          description: The token of the next page. Absent on the last page.
          example: AZpbHnwtcACAAEsdLD5PUg
          x-order: 2
      required:
        - runs
    Run:
      type: object
      description: A Run with its data, what it waits for, and its Steps.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The Run's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f55
          x-order: 1
        status:
          $ref: "#/components/schemas/RunStatus"
          description: The Run's status.
          example: running
          x-order: 2
        task:
          $ref: "#/components/schemas/RunTask"
          description: The Task the Run runs.
          example:
            id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f54
            app: shop
            name: nightly-report
          x-order: 3
        createdAt:
          type: string
          format: date-time
          description: When the Run was created.
          example: "2026-11-16T08:00:00Z"
          x-order: 4
        startedAt:
          type: string
          format: date-time
          description: When a worker first claimed the Run. Absent while it is queued.
          example: "2026-11-16T08:00:01Z"
          x-order: 5
        endedAt:
          type: string
          format: date-time
          description: When the Run ended. Absent until it ends.
          example: "2026-11-16T08:00:09Z"
          x-order: 6
        input:
          description: The Run's input, as JSON. Absent when it has none.
          x-go-type: json.RawMessage
          x-order: 7
          example:
            orderId: 42
        output:
          description: What the Run returned, as JSON. Absent unless it succeeded with an output.
          x-go-type: json.RawMessage
          x-order: 8
          example:
            orders: 142
            total: 2769
        error:
          $ref: "#/components/schemas/Failure"
          description: Why the Run failed. Absent unless it failed.
          example:
            code: step_failed
            message: totals service timed out
          x-order: 9
        config:
          $ref: "#/components/schemas/RunConfig"
          description: The Task's settings when the Run was created.
          example:
            retry:
              maxAttempts: 3
              delays:
                - 2s
          x-order: 10
        waiting:
          $ref: "#/components/schemas/RunWaiting"
          description: What the Run waits for. Absent when it is running on a worker or has ended.
          example:
            reason: retry
            readyAt: "2026-11-16T08:00:04Z"
            retryStepId: sum-totals
            retryCount: 1
          x-order: 11
        attempt:
          $ref: "#/components/schemas/RunAttempt"
          description: The attempt a worker runs now. Absent unless a worker holds the Run.
          example:
            workerId: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f53
            startedAt: "2026-11-16T08:00:05Z"
          x-order: 12
        steps:
          type: array
          description: The Steps the Run recorded, in the order they were recorded.
          example:
            - id: load-orders
              kind: do
              status: succeeded
              output: 142
              tryCount: 1
              recordedAt: "2026-11-16T08:00:02Z"
          x-order: 13
          items:
            $ref: "#/components/schemas/Step"
      required:
        - id
        - status
        - task
        - createdAt
        - config
        - steps
    RunStatus:
      type: string
      description: Where a Run is in its life. queued, never started; running, started and not ended, including while it waits to retry a Step; succeeded and failed, ended.
      example: running
      enum:
        - queued
        - running
        - succeeded
        - failed
    RunTask:
      type: object
      description: The Task a Run runs.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The Task's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f54
          x-order: 1
        app:
          type: string
          description: The app that declares the Task.
          example: shop
          x-order: 2
        name:
          type: string
          description: The Task's name.
          example: nightly-report
          x-order: 3
      required:
        - id
        - app
        - name
    RunSummary:
      type: object
      description: A Run as a list shows it.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The Run's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f55
          x-order: 1
        status:
          $ref: "#/components/schemas/RunStatus"
          description: The Run's status.
          example: failed
          x-order: 2
        task:
          $ref: "#/components/schemas/RunTask"
          description: The Task the Run runs.
          example:
            id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f54
            app: shop
            name: nightly-report
          x-order: 3
        errorCode:
          type: string
          description: Why the Run failed. Absent unless it failed.
          example: step_failed
          x-order: 4
        createdAt:
          type: string
          format: date-time
          description: When the Run was created.
          example: "2026-11-16T08:00:00Z"
          x-order: 5
        startedAt:
          type: string
          format: date-time
          description: When a worker first claimed the Run. Absent while it is queued.
          example: "2026-11-16T08:00:01Z"
          x-order: 6
        endedAt:
          type: string
          format: date-time
          description: When the Run ended. Absent until it ends.
          example: "2026-11-16T08:00:09Z"
          x-order: 7
      required:
        - id
        - status
        - task
        - createdAt
    RetryPolicy:
      type: object
      description: How often and how late a failed Step is tried again.
      additionalProperties: false
      properties:
        maxAttempts:
          type: integer
          format: int32
          description: The most tries of a Step, the first one included. Absent for the server default.
          example: 3
          x-order: 1
        delays:
          type: array
          description: The waits between tries, as durations; the last one repeats. Absent for the server default.
          x-order: 2
          example:
            - 2s
            - 30s
          items:
            type: string
    Failure:
      type: object
      description: Why a Run or a Step failed.
      additionalProperties: false
      properties:
        code:
          type: string
          description: What went wrong, such as error, panic, step_failed, attempt_lost or start_deadline.
          example: step_failed
          x-order: 1
        message:
          type: string
          description: The error message.
          example: totals service timed out
          x-order: 2
      required:
        - code
        - message
    RunConfig:
      type: object
      description: The Task's settings when the Run was created.
      additionalProperties: false
      properties:
        retry:
          $ref: "#/components/schemas/RetryPolicy"
          description: The Task's retry policy. Absent when the Task has none and the server default applies.
          example:
            maxAttempts: 3
            delays:
              - 2s
          x-order: 1
    RunWaiting:
      type: object
      description: What a Run that is not running waits for.
      additionalProperties: false
      properties:
        reason:
          type: string
          description: worker, the Run is ready and waits for a worker to claim it; retry, it waits until it may try a failed Step again.
          enum:
            - worker
            - retry
          example: retry
          x-order: 1
        readyAt:
          type: string
          format: date-time
          description: When the Run became ready, or for retry, when it becomes ready.
          example: "2026-11-16T08:00:04Z"
          x-order: 2
        retryStepId:
          type: string
          description: The Step the Run tries again. Absent when no Step failed.
          example: sum-totals
          x-order: 3
        retryCount:
          type: integer
          format: int32
          description: The failed tries of retryStepId so far.
          example: 1
          x-order: 4
        startDeadlineAt:
          type: string
          format: date-time
          description: When the Run fails if no worker has started it. Absent when it has no start deadline.
          example: "2026-11-16T08:05:00Z"
          x-order: 5
      required:
        - reason
        - readyAt
        - retryCount
    RunAttempt:
      type: object
      description: The attempt a worker is running now.
      additionalProperties: false
      properties:
        workerId:
          type: string
          format: uuid
          description: The worker session that runs the Run.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f53
          x-order: 1
        startedAt:
          type: string
          format: date-time
          description: When the worker claimed this attempt.
          example: "2026-11-16T08:00:05Z"
          x-order: 2
      required:
        - workerId
        - startedAt
    Step:
      type: object
      description: A Step a Run recorded.
      additionalProperties: false
      properties:
        id:
          type: string
          description: The Step's ID in the Run, its name and a counter after the first use, such as charge#2.
          example: load-orders
          x-order: 1
        kind:
          type: string
          description: What the Step records. do, the result of a function.
          enum:
            - do
          example: do
          x-order: 2
        status:
          type: string
          description: Whether the Step succeeded or failed for good.
          enum:
            - succeeded
            - failed
          example: succeeded
          x-order: 3
        output:
          description: What the Step returned, as JSON. Absent when it failed.
          x-go-type: json.RawMessage
          x-order: 4
          example:
            orders: 142
        error:
          $ref: "#/components/schemas/Failure"
          description: Why the Step failed. Absent when it succeeded.
          example:
            code: error
            message: totals service timed out
          x-order: 5
        tryCount:
          type: integer
          format: int32
          description: The tries the Step took.
          example: 1
          x-order: 6
        recordedAt:
          type: string
          format: date-time
          description: When the server recorded the Step.
          example: "2026-11-16T08:00:02Z"
          x-order: 7
      required:
        - id
        - kind
        - status
        - tryCount
        - recordedAt
    WorkerList:
      type: object
      description: A page of workers, newest first.
      additionalProperties: false
      properties:
        workers:
          type: array
          description: The workers of the page.
          x-order: 1
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f53
              app: shop
              slots: 10
              tasks:
                - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f54
                  name: charge
              connectedAt: "2026-11-16T08:00:00Z"
              heartbeatAt: "2026-11-16T08:05:00Z"
          items:
            $ref: "#/components/schemas/Worker"
        nextPageToken:
          type: string
          description: The token of the next page. Absent on the last page.
          example: AZpbHnwtcACAAEsdLD5PUg
          x-order: 2
      required:
        - workers
    WorkerTask:
      type: object
      description: A Task a worker serves.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The Task's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f54
          x-order: 1
        name:
          type: string
          description: The Task's name.
          example: charge
          x-order: 2
      required:
        - id
        - name
    WorkerEndReason:
      type: string
      description: Why a worker session ended. deregistered, the worker stopped; heartbeat_timeout, the server heard nothing from it for too long; revoked, its API key was revoked.
      example: heartbeat_timeout
      enum:
        - deregistered
        - heartbeat_timeout
        - revoked
    Worker:
      type: object
      description: A worker process connected to the project, or one that has ended.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The worker session's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f53
          x-order: 1
        app:
          type: string
          description: The app the worker registered.
          example: shop
          x-order: 2
        slots:
          type: integer
          format: int32
          description: The most Runs the worker runs at once.
          example: 10
          x-order: 3
        tasks:
          type: array
          description: The Tasks the worker serves, by name.
          x-order: 4
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f54
              name: charge
          items:
            $ref: "#/components/schemas/WorkerTask"
        connectedAt:
          type: string
          format: date-time
          description: When the worker registered.
          example: "2026-11-16T08:00:00Z"
          x-order: 5
        heartbeatAt:
          type: string
          format: date-time
          description: The last heartbeat the server recorded.
          example: "2026-11-16T08:05:00Z"
          x-order: 6
        endedAt:
          type: string
          format: date-time
          description: When the session ended. Absent while the worker is live.
          example: "2026-11-16T09:00:00Z"
          x-order: 7
        endReason:
          $ref: "#/components/schemas/WorkerEndReason"
          description: Why the session ended. Absent while the worker is live.
          example: deregistered
          x-order: 8
      required:
        - id
        - app
        - slots
        - tasks
        - connectedAt
        - heartbeatAt
    UserList:
      type: object
      description: A page of users, oldest first.
      additionalProperties: false
      properties:
        users:
          type: array
          description: The users of the page.
          x-order: 1
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
              username: ana
              email: ana@example.com
              isServerAdmin: false
              createdAt: "2026-11-14T08:00:00Z"
          items:
            $ref: "#/components/schemas/ManagedUser"
        nextPageToken:
          type: string
          description: The token of the next page. Absent on the last page.
          example: AZpbHnwtcACAAEsdLD5PUg
          x-order: 2
      required:
        - users
    CreateUserRequest:
      type: object
      description: The new user.
      additionalProperties: false
      properties:
        username:
          type: string
          description: The username. It is lowercased, then must be 1 to 64 characters of a-z, 0-9, '.', '_' and '-'.
          minLength: 1
          maxLength: 64
          example: ana
          x-order: 1
        email:
          type: string
          description: The email, lowercased. Optional.
          minLength: 1
          maxLength: 254
          example: ana@example.com
          x-order: 2
        password:
          type: string
          description: >-
            The password: at least 8 characters, with an upper-case letter, a lower-case letter, a digit and a special character.
          minLength: 1
          maxLength: 128
          example: Secret-123
          x-order: 3
        isServerAdmin:
          type: boolean
          description: True to make the user a server admin.
          example: false
          x-order: 4
      required:
        - username
        - password
        - isServerAdmin
    ManagedUser:
      type: object
      description: A user as the user management page shows it.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The user's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
          x-order: 1
        username:
          type: string
          description: The username, lowercase.
          example: ana
          x-order: 2
        email:
          type: string
          description: The email, lowercase. Absent when the user has none.
          example: ana@example.com
          x-order: 3
        isServerAdmin:
          type: boolean
          description: True when the user is a server admin, admin in every project.
          example: false
          x-order: 4
        disabledAt:
          type: string
          format: date-time
          description: When the user was disabled. Absent while the user can sign in.
          example: "2026-11-14T09:00:00Z"
          x-order: 5
        createdAt:
          type: string
          format: date-time
          description: When the user was created.
          example: "2026-11-14T08:00:00Z"
          x-order: 6
      required:
        - id
        - username
        - isServerAdmin
        - createdAt
    UserLookup:
      type: object
      description: A page of active users, oldest first.
      additionalProperties: false
      properties:
        users:
          type: array
          description: The users of the page.
          x-order: 1
          example:
            - id: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
              username: ana
              email: ana@example.com
          items:
            $ref: "#/components/schemas/UserSummary"
        nextPageToken:
          type: string
          description: The token of the next page. Absent on the last page.
          example: AZpbHnwtcACAAEsdLD5PUg
          x-order: 2
      required:
        - users
    UpdateUserRequest:
      type: object
      description: The user's new state. Every field is replaced.
      additionalProperties: false
      properties:
        email:
          type:
            - string
            - "null"
          description: The new email, lowercased, or null to remove it.
          minLength: 1
          maxLength: 254
          example: ana@example.com
          x-order: 1
        isServerAdmin:
          type: boolean
          description: True to make the user a server admin, false to take the role away.
          example: true
          x-order: 2
        disabled:
          type: boolean
          description: True to disable the user and end their sessions, false to let them sign in again.
          example: false
          x-order: 3
      required:
        - email
        - isServerAdmin
        - disabled
    ResetPasswordRequest:
      type: object
      description: The user's new password.
      additionalProperties: false
      properties:
        newPassword:
          type: string
          description: >-
            The new password: at least 8 characters, with an upper-case letter, a lower-case letter, a digit and a special character.
          minLength: 1
          maxLength: 128
          example: Secret-123
          x-order: 1
      required:
        - newPassword
    UserSummary:
      type: object
      description: A user as a picker shows it.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The user's ID.
          example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
          x-order: 1
        username:
          type: string
          description: The username, lowercase.
          example: ana
          x-order: 2
        email:
          type: string
          description: The email, lowercase. Absent when the user has none.
          example: ana@example.com
          x-order: 3
      required:
        - id
        - username
    Version:
      type: object
      description: The build of the running server.
      additionalProperties: false
      properties:
        version:
          type: string
          description: The release tag, or dev for a local build.
          example: v0.3.0
          x-order: 1
        commit:
          type: string
          description: The Git commit the server was built from. Empty for a local build.
          example: d0716664e1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6
          x-order: 2
        buildDate:
          type: string
          description: When the server was built, in RFC 3339 UTC. Empty for a local build.
          example: "2026-11-14T08:00:00Z"
          x-order: 3
        goVersion:
          type: string
          description: The Go version the server was built with.
          example: go1.27.0
          x-order: 4
      required:
        - version
        - commit
        - buildDate
        - goVersion
  responses:
    InvalidRequest:
      description: "invalid_request: the request is not valid. params lists the fields at fault."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_request
            message: request is not valid
            params:
              - field: login
                message: login is required
              - field: password
                message: password is required
    Unauthenticated:
      description: "unauthenticated: no live session."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unauthenticated
            message: not signed in
    PermissionDenied:
      description: "permission_denied: the caller lacks the permission."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: permission_denied
            message: permission denied
    PayloadTooLarge:
      description: "payload_too_large: the body is larger than 1 MiB."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: payload_too_large
            message: request body is too large
    Conflict:
      description: "already_exists or last_server_admin: the request clashes with what exists."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: already_exists
            message: username is taken
            params:
              - field: username
                message: username is taken
    NotFound:
      description: "not_found: the resource does not exist, or the caller cannot see it."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: not_found
            message: project not found
  pathItems:
    login:
      post:
        operationId: login
        summary: Sign in
        description: >-
          Checks a username or an email and its password, starts a session and sets its cookie. A disabled user cannot sign in.
        tags:
          - Auth
        security: []
        requestBody:
          description: The credentials.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginRequest"
        responses:
          "200":
            description: The session is started
            headers:
              Set-Cookie:
                description: The session cookie.
                required: true
                schema:
                  type: string
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/LoginResponse"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: the body is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: the login or the password is wrong, or the user is disabled"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the request comes from another origin"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
    logout:
      post:
        operationId: logout
        summary: Sign out
        description: >-
          Ends the session, if it is still live, and clears its cookie. A request without a live session also clears the cookie.
        tags:
          - Auth
        security: []
        responses:
          "204":
            description: The session is ended
            headers:
              Set-Cookie:
                description: Clears the session cookie.
                required: true
                schema:
                  type: string
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the request comes from another origin"
    me:
      get:
        operationId: getMe
        summary: Get the signed-in user
        description: >-
          Returns the signed-in user, the projects they can open with their role and permissions in each, and their server-wide permissions.
        tags:
          - Auth
        x-runcoil-permission: self
        responses:
          "200":
            description: The signed-in user
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Me"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
    mePassword:
      put:
        operationId: changeMyPassword
        summary: Change my password
        description: >-
          Sets a new password for the signed-in user and ends their other sessions. The new password has at least 8 characters, with an upper-case letter, a lower-case letter, a digit and a special character.
        tags:
          - Auth
        x-runcoil-permission: self
        requestBody:
          description: The current and the new password.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordRequest"
        responses:
          "204":
            description: The password is changed
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: the body is not valid, the current password is wrong, or the new password is too weak"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the request comes from another origin"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
    projects:
      get:
        operationId: listProjects
        summary: List projects
        description: >-
          Returns every project, by name. Only a server admin can list them; the projects of the signed-in user and their roles are in GET /me.
        tags:
          - Projects
        x-runcoil-permission: projects:read
        responses:
          "200":
            description: The projects
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ProjectList"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not a server admin"
      post:
        operationId: createProject
        summary: Create a project
        description: Creates a project with no members. Only a server admin can create one.
        tags:
          - Projects
        x-runcoil-permission: projects:create
        requestBody:
          description: The new project.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectRequest"
        responses:
          "201":
            description: The project is created
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Project"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: the body is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not a server admin, or the request comes from another origin"
          "409":
            $ref: "#/components/responses/Conflict"
            description: "already_exists: a project has the name"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
    members:
      parameters:
        - name: projectId
          in: path
          description: The project's ID.
          required: true
          schema:
            type: string
            format: uuid
            example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
      get:
        operationId: listMembers
        summary: List the members of a project
        description: Returns the members of a project, by username. Server admins are admin everywhere and are listed only when they are members.
        tags:
          - Members
        x-runcoil-permission: members:read
        responses:
          "200":
            description: The members
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/MemberList"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId is not a UUID"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not an admin of the project"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, or the caller is not a member"
      post:
        operationId: addMember
        summary: Add a member to a project
        description: Gives a user, named by username, a role in a project.
        tags:
          - Members
        x-runcoil-permission: members:write
        requestBody:
          description: The user and the role.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddMemberRequest"
        responses:
          "201":
            description: The member is added
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Member"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId is not a UUID, or the body is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not an admin of the project, or the request comes from another origin"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, the caller is not a member, or no user has the username"
          "409":
            $ref: "#/components/responses/Conflict"
            description: "already_exists: the user is already a member"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
    member:
      parameters:
        - name: projectId
          in: path
          description: The project's ID.
          required: true
          schema:
            type: string
            format: uuid
            example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
        - name: userId
          in: path
          description: The member's user ID.
          required: true
          schema:
            type: string
            format: uuid
            example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
      put:
        operationId: updateMember
        summary: Change a member's role
        description: Gives a member another role in the project.
        tags:
          - Members
        x-runcoil-permission: members:write
        requestBody:
          description: The new role.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMemberRequest"
        responses:
          "200":
            description: The updated member
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Member"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId or userId is not a UUID, or the body is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not an admin of the project, or the request comes from another origin"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, the caller is not a member, or the user is not a member"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
      delete:
        operationId: removeMember
        summary: Remove a member from a project
        description: Takes a user's role in the project away.
        tags:
          - Members
        x-runcoil-permission: members:write
        responses:
          "204":
            description: The member is removed
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId or userId is not a UUID"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not an admin of the project, or the request comes from another origin"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, the caller is not a member, or the user is not a member"
    apiKeys:
      parameters:
        - name: projectId
          in: path
          description: The project's ID.
          required: true
          schema:
            type: string
            format: uuid
            example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
      get:
        operationId: listApiKeys
        summary: List the API keys of a project
        description: Returns the API keys of a project, revoked ones included, newest first, with the username of who made each.
        tags:
          - API keys
        x-runcoil-permission: api_keys:read
        responses:
          "200":
            description: The API keys
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ApiKeyList"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId is not a UUID"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not an admin of the project"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, or the caller is not a member"
      post:
        operationId: createApiKey
        summary: Create an API key
        description: Makes a new API key for the project. The response holds the key, which is never shown again.
        tags:
          - API keys
        x-runcoil-permission: api_keys:write
        requestBody:
          description: The new API key.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyRequest"
        responses:
          "201":
            description: The API key is made
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CreatedApiKey"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId is not a UUID, or the body is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not an admin of the project, or the request comes from another origin"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, or the caller is not a member"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
    apiKeyRevoke:
      parameters:
        - name: projectId
          in: path
          description: The project's ID.
          required: true
          schema:
            type: string
            format: uuid
            example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
        - name: apiKeyId
          in: path
          description: The API key's ID.
          required: true
          schema:
            type: string
            format: uuid
            example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f53
      post:
        operationId: revokeApiKey
        summary: Revoke an API key
        description: >-
          Stops the key from working. The worker sessions it opened are refused at their next call and end when they miss their heartbeats. Revoking a revoked key does nothing.
        tags:
          - API keys
        x-runcoil-permission: api_keys:write
        responses:
          "204":
            description: The API key is revoked
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId or apiKeyId is not a UUID"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not an admin of the project, or the request comes from another origin"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, the caller is not a member, or the project has no such API key"
    runs:
      get:
        operationId: listRuns
        summary: List the Runs of a project
        description: Returns a page of the project's Runs, newest first, with each Run's Task.
        tags:
          - Runs
        x-runcoil-permission: runs:read
        parameters:
          - name: projectId
            in: path
            description: The project's ID.
            required: true
            schema:
              type: string
              format: uuid
              example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
          - name: status
            in: query
            description: Only Runs in one of these statuses. Absent for every status.
            required: false
            style: form
            explode: true
            schema:
              type: array
              maxItems: 4
              items:
                type: string
                enum:
                  - queued
                  - running
                  - succeeded
                  - failed
              example:
                - running
                - failed
          - name: taskId
            in: query
            description: Only Runs of this Task.
            required: false
            schema:
              type: string
              format: uuid
              example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f54
          - name: pageSize
            in: query
            description: The most Runs to return.
            required: false
            schema:
              type: integer
              format: int32
              minimum: 1
              maximum: 100
              default: 50
              example: 50
          - name: pageToken
            in: query
            description: The nextPageToken of the previous page. Absent for the first page.
            required: false
            schema:
              type: string
              maxLength: 64
              example: AZpbHnwtcACAAEsdLD5PUg
        responses:
          "200":
            description: A page of Runs
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/RunList"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId or taskId is not a UUID, or status, pageSize or pageToken is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, or the caller is not a member"
    run:
      get:
        operationId: getRun
        summary: Get a Run
        description: Returns a Run with its input, output, error, settings, what it waits for, and its Steps in the order they were recorded.
        tags:
          - Runs
        x-runcoil-permission: runs:read
        parameters:
          - name: projectId
            in: path
            description: The project's ID.
            required: true
            schema:
              type: string
              format: uuid
              example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
          - name: runId
            in: path
            description: The Run's ID.
            required: true
            schema:
              type: string
              format: uuid
              example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f55
        responses:
          "200":
            description: The Run
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Run"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId or runId is not a UUID"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, the caller is not a member, or the project has no such Run"
    workers:
      get:
        operationId: listWorkers
        summary: List the workers of a project
        description: Returns a page of the project's live workers, newest first, or of its ended workers with state=ended.
        tags:
          - Workers
        x-runcoil-permission: workers:read
        parameters:
          - name: projectId
            in: path
            description: The project's ID.
            required: true
            schema:
              type: string
              format: uuid
              example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f51
          - name: state
            in: query
            description: Which workers to list, live or ended.
            required: false
            schema:
              type: string
              enum:
                - live
                - ended
              default: live
              example: live
          - name: pageSize
            in: query
            description: The most workers to return.
            required: false
            schema:
              type: integer
              format: int32
              minimum: 1
              maximum: 100
              default: 50
              example: 50
          - name: pageToken
            in: query
            description: The nextPageToken of the previous page. Absent for the first page.
            required: false
            schema:
              type: string
              maxLength: 64
              example: AZpbHnwtcACAAEsdLD5PUg
        responses:
          "200":
            description: A page of workers
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/WorkerList"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: projectId is not a UUID, or state, pageSize or pageToken is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: the project does not exist, or the caller is not a member"
    users:
      get:
        operationId: listUsers
        summary: List users
        description: Returns a page of the users of the server, oldest first.
        tags:
          - Users
        x-runcoil-permission: users:read
        parameters:
          - name: pageSize
            in: query
            description: The most users to return.
            required: false
            schema:
              type: integer
              format: int32
              minimum: 1
              maximum: 100
              default: 50
              example: 50
          - name: pageToken
            in: query
            description: The nextPageToken of the previous page. Absent for the first page.
            required: false
            schema:
              type: string
              maxLength: 64
              example: AZpbHnwtcACAAEsdLD5PUg
        responses:
          "200":
            description: A page of users
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UserList"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: pageSize or pageToken is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not a server admin"
      post:
        operationId: createUser
        summary: Create a user
        description: Creates a user who can sign in. The user is in no project until added to one.
        tags:
          - Users
        x-runcoil-permission: users:write
        requestBody:
          description: The new user.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserRequest"
        responses:
          "201":
            description: The user is created
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ManagedUser"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: the body is not valid, the username or the email is malformed, or the password is too weak"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not a server admin, or the request comes from another origin"
          "409":
            $ref: "#/components/responses/Conflict"
            description: "already_exists: another user has the username or the email"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
    usersLookup:
      get:
        operationId: lookupUsers
        summary: Look up users
        description: >-
          Returns a page of the active users, oldest first, for a picker such as adding a project member. Any signed-in user may look up users, and gets only their usernames and emails.
        tags:
          - Users
        x-runcoil-permission: authenticated
        parameters:
          - name: pageSize
            in: query
            description: The most users to return.
            required: false
            schema:
              type: integer
              format: int32
              minimum: 1
              maximum: 100
              default: 50
              example: 50
          - name: pageToken
            in: query
            description: The nextPageToken of the previous page. Absent for the first page.
            required: false
            schema:
              type: string
              maxLength: 64
              example: AZpbHnwtcACAAEsdLD5PUg
        responses:
          "200":
            description: A page of active users
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UserLookup"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: pageSize or pageToken is not valid"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
    user:
      parameters:
        - name: userId
          in: path
          description: The user's ID.
          required: true
          schema:
            type: string
            format: uuid
            example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
      put:
        operationId: updateUser
        summary: Update a user
        description: >-
          Replaces a user's email, server admin role and disabled state. Disabling a user ends their sessions. The last active server admin cannot lose the role or be disabled.
        tags:
          - Users
        x-runcoil-permission: users:write
        requestBody:
          description: The user's new email, server admin role and disabled state.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserRequest"
        responses:
          "200":
            description: The updated user
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ManagedUser"
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: userId is not a UUID, the body is not valid, or the email is malformed"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not a server admin, or the request comes from another origin"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: no user has the ID"
          "409":
            $ref: "#/components/responses/Conflict"
            description: "already_exists: another user has the email; last_server_admin: the change would leave no active server admin"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
    userPassword:
      parameters:
        - name: userId
          in: path
          description: The user's ID.
          required: true
          schema:
            type: string
            format: uuid
            example: 019a5b1e-7c2d-7000-8000-4b1d2c3e4f52
      put:
        operationId: resetUserPassword
        summary: Reset a user's password
        description: Sets a new password for a user and ends all their sessions.
        tags:
          - Users
        x-runcoil-permission: users:write
        requestBody:
          description: The new password.
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordRequest"
        responses:
          "204":
            description: The password is reset
          "400":
            $ref: "#/components/responses/InvalidRequest"
            description: "invalid_request: userId is not a UUID, the body is not valid, or the password is too weak"
          "401":
            $ref: "#/components/responses/Unauthenticated"
            description: "unauthenticated: no live session"
          "403":
            $ref: "#/components/responses/PermissionDenied"
            description: "permission_denied: the caller is not a server admin, or the request comes from another origin"
          "404":
            $ref: "#/components/responses/NotFound"
            description: "not_found: no user has the ID"
          "413":
            $ref: "#/components/responses/PayloadTooLarge"
            description: "payload_too_large: the body is larger than 1 MiB"
    version:
      get:
        operationId: getVersion
        summary: Get the server version
        description: Returns the version, the commit and the build date of the running server.
        tags:
          - System
        security: []
        responses:
          "200":
            description: The server version
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Version"
